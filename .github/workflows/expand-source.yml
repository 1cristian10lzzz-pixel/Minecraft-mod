name: Expand Minefade source archive

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/expand-source.yml"

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract VoxelCore source tree
        run: |
          mkdir -p VoxelCore-1.12.2
          tar -xzf MinefadeMod-VoxelCore-0.2.0.tar.gz -C VoxelCore-1.12.2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VoxelCore-1.12.2
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git commit -m "Import VoxelCore 0.2.0 source tree"
          git push
