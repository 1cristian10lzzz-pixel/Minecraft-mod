name: Build VoxelCore 1.12.2

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Validate models, recipes, textures and language files
        run: python3 tools/validate_assets.py
      - name: Set up Gradle 4.10.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'
      - name: Build mod
        run: gradle setupCIWorkspace build --no-daemon
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: voxelcore-minecraft-1.12.2
          path: build/libs/*.jar
          if-no-files-found: error
