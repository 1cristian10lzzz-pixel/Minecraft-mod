name: Build Minefade Mod 1.12.2

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minefade-1122-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VoxelCore-1.12.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Validate models, recipes, textures and translations
        run: python3 tools/validate_assets.py
      - name: Set up Gradle 4.10.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'
      - name: Build Forge 1.12.2 mod
        run: gradle setupCIWorkspace build --no-daemon
      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: minefade-mod-minecraft-1.12.2-v0.7.1
          path: VoxelCore-1.12.2/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
